<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lecture Lab</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --accent: #2b59c3;
      --border: #e3e6ef;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    header { margin-bottom: 32px; }
    h1 { color: var(--accent); margin: 0 0 8px; }
    header p { margin: 0; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }
    .card .num {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
    }
    .card h2 {
      font-size: 1.2rem;
      margin: 6px 0 12px;
    }
    .card .status {
      margin-top: auto;
      align-self: flex-start;
      font-size: 0.8rem;
      color: var(--muted);
      background: #eef0f5;
      padding: 4px 10px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Lecture Lab</h1>
      <p>AI 강의 실습 프로젝트 모음입니다. 카드를 눌러 각 프로젝트로 이동하세요.</p>
    </header>

    <!-- 각 카드의 href="#" 를 실제 GitHub Pages 주소로 바꾸면 링크가 작동합니다. -->
    <main class="grid">
      <a class="card" href="#">
        <span class="num">01</span>
        <h2>할일 목록 리스트</h2>
        <span class="status">준비 중</span>
      </a>
      <a class="card" href="#">
        <span class="num">02</span>
        <h2>클로드 활용 스네이크 게임</h2>
        <span class="status">준비 중</span>
      </a>
      <a class="card" href="#">
        <span class="num">03</span>
        <h2>개인 프로파일</h2>
        <span class="status">준비 중</span>
      </a>
      <a class="card" href="#">
        <span class="num">04</span>
        <h2>주식 일기</h2>
        <span class="status">준비 중</span>
      </a>
      <a class="card" href="#">
        <span class="num">05</span>
        <h2>4축 로봇암 시뮬레이터</h2>
        <span class="status">준비 중</span>
      </a>
      <a class="card" href="#">
        <span class="num">06</span>
        <h2>이북(ebook) 쇼핑몰</h2>
        <span class="status">준비 중</span>
      </a>
    </main>
  </div>
</body>
</html>
